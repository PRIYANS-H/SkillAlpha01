# Local full stack: Postgres + API + built SPA.
# Supabase keys come from your shell or a root .env file (see .env.example);
# without SUPABASE_JWT_SECRET / SUPABASE_URL every API request returns 401.
services:
  postgres:
    image: postgres:15-alpine
    container_name: skillalpha_postgres
    environment:
      POSTGRES_DB: skillalpha
      POSTGRES_USER: skillalpha_user
      POSTGRES_PASSWORD: skillalpha_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillalpha_user -d skillalpha"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: skillalpha_backend
    environment:
      DATABASE_URL: postgresql://skillalpha_user:skillalpha_password@postgres:5432/skillalpha
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      FRONTEND_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    container_name: skillalpha_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
